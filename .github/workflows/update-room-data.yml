name: Update room data

on:
  repository_dispatch:
    types:
      - update-room-data

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: rooms.json aktualisieren
        env:
          ROOM_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$ROOM_PAYLOAD" | jq '.' > rooms.json

      - name: Änderung committen
        run: |
          git config user.name "Room Data Bot"
          git config user.email "room-data-bot@users.noreply.github.com"
          git add rooms.json
          git diff --cached --quiet || git commit -m "Update room data"
          git push
