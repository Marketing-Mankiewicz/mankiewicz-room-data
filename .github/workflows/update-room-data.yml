name: Update room data

on:
  repository_dispatch:
    types:
      - update-room-data

permissions:
  contents: write

jobs:
  update-room-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: rooms.json erzeugen
        env:
          ROOM_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$ROOM_PAYLOAD" | jq '{
            updatedAt: .updatedAt,
            rooms: [
              {
                id: "neufundland",
                name: "Neufundland",
                appointments: .appointments
              }
            ]
          }' > rooms.json

      - name: rooms.json speichern
        run: |
          git config user.name "Room Data Bot"
          git config user.email "room-data-bot@users.noreply.github.com"

          git add rooms.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "Raumdaten aktualisieren"
          git push
